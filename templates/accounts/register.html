{% extends 'base.html' %}
{% load custom_filters %}
{% block title %}Register - HireHub{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-gray-900">Join HireHub</h2>
            <p class="text-gray-500 mt-2">Create your free account today</p>
        </div>

        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-8">
            <!-- Role Toggle -->
            <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
                <button type="button" onclick="setRole('jobseeker')" id="btn-jobseeker"
                        class="flex-1 text-sm font-medium py-2 rounded-lg transition-all bg-white text-gray-900 shadow-sm">
                    🎯 Job Seeker
                </button>
                <button type="button" onclick="setRole('employer')" id="btn-employer"
                        class="flex-1 text-sm font-medium py-2 rounded-lg transition-all text-gray-500">
                    🏢 Employer
                </button>
            </div>

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <input type="hidden" name="role" id="role-field" value="jobseeker">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" name="first_name" required
                               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                               placeholder="Rahul">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" name="last_name" required
                               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                               placeholder="Sharma">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" name="email" required
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                           placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                           placeholder="Min 8 characters">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" name="password2" required
                           class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
                           placeholder="Repeat password">
                </div>
                <button type="submit"
                        class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition-colors mt-2">
                    Create Account
                </button>
            </form>

            <div class="mt-5 text-center">
                <p class="text-sm text-gray-500">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-blue-600 font-medium hover:underline">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
function setRole(role) {
    document.getElementById('role-field').value = role;
    const btnJ = document.getElementById('btn-jobseeker');
    const btnE = document.getElementById('btn-employer');
    if (role === 'jobseeker') {
        btnJ.className = 'flex-1 text-sm font-medium py-2 rounded-lg transition-all bg-white text-gray-900 shadow-sm';
        btnE.className = 'flex-1 text-sm font-medium py-2 rounded-lg transition-all text-gray-500';
    } else {
        btnE.className = 'flex-1 text-sm font-medium py-2 rounded-lg transition-all bg-white text-gray-900 shadow-sm';
        btnJ.className = 'flex-1 text-sm font-medium py-2 rounded-lg transition-all text-gray-500';
    }
}
</script>
{% endblock %}
